name: Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/cirruslabs/android-sdk:35
    env:
      ANDROID_NDK_VERSION: 29.0.14206865
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      USE_CCACHE: 'true'
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - run: |
        apt-get update
        apt-get install -y ninja-build python3 glslang-tools spirv-tools

    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-home-cache-strict-match: false
        validate-wrappers: false

    - uses: actions/cache@v4
      with:
        path: |
          /opt/android-sdk-linux/ndk/${{ env.ANDROID_NDK_VERSION }}
          /opt/android-sdk-linux/cmake/3.30.3
        key: sdk-ndk${{ env.ANDROID_NDK_VERSION }}-cmake3.30.3

    - name: Install NDK and CMake
      run: |
        export ANDROID_SDK_ROOT=/opt/android-sdk-linux
        yes | sdkmanager --licenses > /dev/null
        [ -d "$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" ] || sdkmanager "ndk;$ANDROID_NDK_VERSION"
        [ -d "$ANDROID_SDK_ROOT/cmake/3.30.3" ] || sdkmanager "cmake;3.30.3"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> $GITHUB_ENV
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    - uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-ndk${{ env.ANDROID_NDK_VERSION }}-arm64-debug
        max-size: 2G

    - name: Build
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug -PgitHash=$(git rev-parse --short HEAD) --parallel --max-workers=$(nproc) --no-daemon

    - uses: actions/upload-artifact@v4
      with:
        name: xendroid-debug-${{ github.sha }}
        path: app/build/outputs/apk/debug/*.apk
